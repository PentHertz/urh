name: Build URH Multi-Arch

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: 'Architectures (amd64, arm64, riscv64 or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - amd64
          - arm64
          - riscv64

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: 
          - amd64
          - arm64
          - riscv64
      fail-fast: false
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64,linux/riscv64
      
      - name: Determine platform
        id: platform
        run: |
          case "${{ matrix.arch }}" in
            amd64)
              echo "platform=linux/amd64" >> $GITHUB_OUTPUT
              ;;
            arm64)
              echo "platform=linux/arm64" >> $GITHUB_OUTPUT
              ;;
            riscv64)
              echo "platform=linux/riscv64" >> $GITHUB_OUTPUT
              ;;
          esac
      
      - name: Get version
        id: version
        run: |
          VERSION=$(grep "version=" setup.py | head -1 | sed "s/.*version=['\"]\\([^'\"]*\\)['\"].*/\\1/" || echo "2.9.4")
          DATE=$(date +%Y%m%d)
          COMMIT=$(git rev-parse --short HEAD)
          DEB_VERSION="${VERSION}+git${DATE}.${COMMIT}"
          echo "deb_version=${DEB_VERSION}" >> $GITHUB_OUTPUT
      
      - name: Build URH for ${{ matrix.arch }}
        run: |
          cat > build-urh.sh << 'BUILDSCRIPT'
          #!/bin/bash
          set -e
          
          echo "=== Building URH for $(uname -m) ==="
          
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
              python3-venv python3-dev python3-pip \
              build-essential cython3 \
              libxml2-dev libxslt1-dev zlib1g-dev \
              dpkg-dev fakeroot git
          
          # Copy workspace to writable location (Cython needs to write .cpp files)
          echo "[+] Copying source to writable location"
          cp -r /workspace-ro /workspace
          cd /workspace
          
          URH_VENV_DIR="/opt/urh-venv"
          
          echo "[+] Creating Python virtual environment"
          python3 -m venv "$URH_VENV_DIR"
          source "$URH_VENV_DIR/bin/activate"
          
          echo "[+] Installing dependencies"
          pip install --upgrade pip setuptools wheel
          pip install cython numpy
          pip install --only-binary=all pyqt5
          pip install psutil
          
          echo "[+] Building URH (attempt 1: with Cython extensions)"
          BUILD_TYPE="failed"
          if python3 setup.py install 2>&1 | tee /tmp/build.log; then
              if [ -f "$URH_VENV_DIR/bin/urh" ]; then
                  echo "[+] Build successful with native extensions"
                  BUILD_TYPE="native"
              else
                  echo "[!] Build reported success but urh not found"
                  BUILD_TYPE="failed"
              fi
          fi
          
          if [ "$BUILD_TYPE" = "failed" ]; then
              echo "[!] Cython build failed, retrying without native extensions"
              rm -rf build/ src/urh.egg-info/ "$URH_VENV_DIR"
              python3 -m venv "$URH_VENV_DIR"
              source "$URH_VENV_DIR/bin/activate"
              pip install --upgrade pip setuptools wheel
              pip install cython numpy
              pip install --only-binary=all pyqt5
              pip install psutil
              export URH_NO_NATIVE_EXTENSIONS=1
              python3 setup.py install
              BUILD_TYPE="no-native"
          fi
          
          deactivate
          
          # Verify installation
          if [ ! -f "$URH_VENV_DIR/bin/urh" ]; then
              echo "[!] ERROR: URH not installed!"
              ls -la "$URH_VENV_DIR/bin/" || true
              exit 1
          fi
          
          echo "[+] URH installed successfully: $BUILD_TYPE extensions"
          ls -la "$URH_VENV_DIR/bin/urh"
          
          echo "[+] Creating Debian package"
          ARCH=$(dpkg --print-architecture)
          PKG_NAME="urh-penthertz_${ARCH}_${DEB_VERSION}"
          PKG_DIR="/tmp/pkg"
          
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/opt"
          mkdir -p "${PKG_DIR}/usr/sbin"
          mkdir -p "${PKG_DIR}/usr/share/applications"
          mkdir -p "${PKG_DIR}/usr/share/doc/urh-penthertz"
          
          echo "[+] Copying virtual environment"
          cp -a "$URH_VENV_DIR" "${PKG_DIR}/opt/"
          
          echo "[+] Creating wrapper script"
          cat > "${PKG_DIR}/usr/sbin/urh" << 'WRAPPER'
          #!/bin/bash
          URH_VENV_DIR="/opt/urh-venv"
          
          if [ ! -d "$URH_VENV_DIR" ]; then
              echo "Error: URH virtual environment not found at $URH_VENV_DIR"
              exit 1
          fi
          
          if [ ! -f "$URH_VENV_DIR/bin/urh" ]; then
              echo "Error: URH not found in virtual environment"
              exit 1
          fi
          
          if [ -z "$XDG_RUNTIME_DIR" ]; then
              export XDG_RUNTIME_DIR="/tmp/runtime-$(whoami)"
              mkdir -p "$XDG_RUNTIME_DIR"
              chmod 700 "$XDG_RUNTIME_DIR"
          fi
          
          source "$URH_VENV_DIR/bin/activate"
          exec "$URH_VENV_DIR/bin/urh" "$@"
          WRAPPER
          
          chmod +x "${PKG_DIR}/usr/sbin/urh"
          
          echo "[+] Creating desktop entry"
          cat > "${PKG_DIR}/usr/share/applications/urh.desktop" << 'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Universal Radio Hacker
          GenericName=Wireless Protocol Analyzer
          Comment=Investigate wireless protocols with URH
          Exec=urh %F
          Icon=urh
          Terminal=false
          Categories=Network;Utility;Development;
          MimeType=application/x-urh;
          DESKTOP
          
          echo "[+] Creating control file"
          cat > "${PKG_DIR}/DEBIAN/control" << CONTROL
          Package: urh-penthertz
          Version: ${DEB_VERSION}
          Section: comm
          Priority: optional
          Architecture: ${ARCH}
          Depends: python3-venv, python3 (>= 3.10), libxml2, libxslt1.1, zlib1g
          Conflicts: urh
          Provides: urh
          Replaces: urh
          Maintainer: PentHertz <contact@penthertz.com>
          Description: Universal Radio Hacker (PentHertz/HydraSDR Fork)
           URH is a complete suite for wireless protocol investigation with native
           device support for Software Defined Radios.
           .
           This package contains URH in a self-contained Python virtual environment,
           built from the PentHertz/HydraSDR fork.
           .
           Build type: ${BUILD_TYPE} extensions
          Homepage: https://github.com/PentHertz/urh
          CONTROL
          
          echo "[+] Creating copyright"
          cat > "${PKG_DIR}/usr/share/doc/urh-penthertz/copyright" << 'COPYRIGHT'
          Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
          Upstream-Name: urh
          Upstream-Contact: PentHertz <contact@penthertz.com>
          Source: https://github.com/PentHertz/urh
          
          Files: *
          Copyright: 2016-2024 Johannes Pohl and contributors
                     2024 PentHertz
          License: GPL-3+
          COPYRIGHT
          
          echo "[+] Building package"
          dpkg-deb --build "${PKG_DIR}" "/output/${PKG_NAME}.deb"
          
          echo "[+] Creating build info"
          cat > "/output/BUILD_INFO_${ARCH}.txt" << BUILDINFO
          URH Debian Package - Build Information
          =======================================
          Build Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          Architecture: ${ARCH} ($(uname -m))
          Version: ${DEB_VERSION}
          Build Type: ${BUILD_TYPE} extensions
          Method: Virtual environment (the way that works!)
          
          Package: ${PKG_NAME}.deb
          Size: $(du -h "/output/${PKG_NAME}.deb" | cut -f1)
          
          Installation:
            sudo dpkg -i ${PKG_NAME}.deb
            sudo apt-get install -f  # If dependencies needed
          BUILDINFO
          
          echo "=== Build Complete ==="
          ls -lh /output/
          cat "/output/BUILD_INFO_${ARCH}.txt"
          BUILDSCRIPT
          
          chmod +x build-urh.sh
          
          mkdir -p output
          docker run --rm \
            --platform "${{ steps.platform.outputs.platform }}" \
            -v "$(pwd):/workspace-ro:ro" \
            -v "$(pwd)/build-urh.sh:/build.sh:ro" \
            -v "$(pwd)/output:/output" \
            -e DEB_VERSION="${{ steps.version.outputs.deb_version }}" \
            ubuntu:24.04 \
            bash /build.sh
      
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: urh-penthertz-${{ matrix.arch }}-${{ steps.version.outputs.deb_version }}
          path: |
            output/*.deb
            output/BUILD_INFO_*.txt
      
      - name: Show result
        run: |
          echo "=== Build Complete for ${{ matrix.arch }} ==="
          ls -lh output/
          echo ""
          cat output/BUILD_INFO_*.txt
  
  summary:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "=== Multi-Architecture Build Complete ==="
          echo ""
          echo "Packages built for:"
          echo "  - amd64"
          echo "  - arm64"
          echo "  - riscv64"
          echo ""
          echo "Download packages from the 'Artifacts' section above"