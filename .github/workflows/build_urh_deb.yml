name: Build URH DEB Package

on:
  workflow_dispatch:

jobs:
  build-urh-amd64:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout URH repository
        uses: actions/checkout@v4
      
      - name: Get version info
        id: version
        run: |
          VERSION=$(grep "version=" setup.py | head -1 | sed "s/.*version=['\"]\\([^'\"]*\\)['\"].*/\\1/" || echo "2.9.4")
          DATE=$(date +%Y%m%d)
          COMMIT=$(git rev-parse --short HEAD)
          DEB_VERSION="${VERSION}+git${DATE}.${COMMIT}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "deb_version=${DEB_VERSION}" >> $GITHUB_OUTPUT
      
      - name: Build URH in Docker
        run: |
          cat > build-urh.sh << 'BUILDSCRIPT'
          #!/bin/bash
          set -e
          
          echo "=== Building URH the proven way ==="
          
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
              python3-venv python3-dev python3-pip \
              build-essential cython3 \
              libxml2-dev libxslt1-dev zlib1g-dev \
              dpkg-dev fakeroot git
          
          URH_VENV_DIR="/opt/urh-venv"
          cd /workspace
          
          echo "[+] Creating Python virtual environment"
          python3 -m venv "$URH_VENV_DIR"
          source "$URH_VENV_DIR/bin/activate"
          
          echo "[+] Installing dependencies"
          pip install --upgrade pip setuptools wheel
          pip install cython numpy
          pip install --only-binary=all pyqt5
          pip install psutil
          
          echo "[+] Building URH"
          python3 setup.py install || {
              echo "[+] Retrying without native extensions"
              export URH_NO_NATIVE_EXTENSIONS=1
              python3 setup.py install
          }
          
          deactivate
          
          echo "[+] Creating Debian package"
          ARCH=$(dpkg --print-architecture)
          PKG_NAME="urh-penthertz_${ARCH}_${DEB_VERSION}"
          PKG_DIR="/tmp/pkg"
          
          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/opt"
          mkdir -p "${PKG_DIR}/usr/sbin"
          mkdir -p "${PKG_DIR}/usr/share/doc/urh-penthertz"
          
          cp -a "$URH_VENV_DIR" "${PKG_DIR}/opt/"
          
          cat > "${PKG_DIR}/usr/sbin/urh" << 'WRAPPER'
          #!/bin/bash
          URH_VENV_DIR="/opt/urh-venv"
          if [ ! -d "$URH_VENV_DIR" ]; then
              echo "Error: URH virtual environment not found"
              exit 1
          fi
          if [ -z "$XDG_RUNTIME_DIR" ]; then
              export XDG_RUNTIME_DIR="/tmp/runtime-$(whoami)"
              mkdir -p "$XDG_RUNTIME_DIR"
              chmod 700 "$XDG_RUNTIME_DIR"
          fi
          source "$URH_VENV_DIR/bin/activate"
          exec "$URH_VENV_DIR/bin/urh" "$@"
          WRAPPER
          
          chmod +x "${PKG_DIR}/usr/sbin/urh"
          
          cat > "${PKG_DIR}/DEBIAN/control" << CONTROL
          Package: urh-penthertz
          Version: ${DEB_VERSION}
          Section: comm
          Priority: optional
          Architecture: ${ARCH}
          Depends: python3-venv, python3 (>= 3.10), libxml2, libxslt1.1, zlib1g
          Maintainer: PentHertz <contact@penthertz.com>
          Description: Universal Radio Hacker (PentHertz Fork)
           URH is a complete suite for wireless protocol investigation.
           This package contains URH built from the PentHertz/HydraSDR fork.
          CONTROL
          
          cat > "${PKG_DIR}/usr/share/doc/urh-penthertz/copyright" << 'COPYRIGHT'
          Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/
          Upstream-Name: urh
          Source: https://github.com/PentHertz/urh
          
          Files: *
          Copyright: 2016-2024 Johannes Pohl and contributors
          License: GPL-3+
          COPYRIGHT
          
          dpkg-deb --build "${PKG_DIR}" "/output/${PKG_NAME}.deb"
          
          echo "=== Package created ==="
          ls -lh /output/
          BUILDSCRIPT
          
          chmod +x build-urh.sh
          
          mkdir -p output
          docker run --rm \
            -v "$(pwd):/workspace:ro" \
            -v "$(pwd)/build-urh.sh:/build.sh:ro" \
            -v "$(pwd)/output:/output" \
            -e DEB_VERSION="${{ steps.version.outputs.deb_version }}" \
            ubuntu:24.04 \
            bash /build.sh
      
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: urh-penthertz-amd64-${{ steps.version.outputs.deb_version }}
          path: output/*.deb
      
      - name: Show result
        run: |
          echo "Package built successfully!"
          ls -lh output/